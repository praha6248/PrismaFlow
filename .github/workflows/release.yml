name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Python environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: PyInstaller
        working-directory: packaging
        run: ../.venv/bin/pyinstaller --noconfirm --distpath ../dist --workpath ../build prismflow.spec
      - name: Archive
        run: tar -C dist -czf PrismFlow-linux-x86_64.tar.gz PrismFlow
      - uses: actions/upload-artifact@v5
        with:
          name: PrismFlow-linux-x86_64
          path: PrismFlow-linux-x86_64.tar.gz
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PrismFlow-linux-x86_64.tar.gz --generate-notes --title "PrismFlow $GITHUB_REF_NAME"
